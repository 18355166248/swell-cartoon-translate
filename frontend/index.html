<!doctype html>
<meta charset="utf-8">
<title>ctt editor</title>
<style>
  :root {
    --bg: #16181d; --panel: #1e2128; --line: #30343d;
    --text: #e6e8ec; --muted: #9aa2b1; --accent: #5b9dff; --warn: #f0a848;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }

  #stage { flex: 1; overflow: auto; position: relative; padding: 24px; }
  #wrap { position: relative; display: inline-block; }
  #page { display: block; max-width: none; }

  .box { position: absolute; border: 2px solid rgba(91,157,255,.55); cursor: move; }
  .box:hover { border-color: var(--accent); background: rgba(91,157,255,.08); }
  .box.sel { border-color: var(--accent); background: rgba(91,157,255,.15);
             box-shadow: 0 0 0 1px #000, 0 0 12px rgba(91,157,255,.5); }
  .box.flag { border-color: var(--warn); }
  .box .tag { position: absolute; top: -20px; left: -2px; font-size: 11px; padding: 0 4px;
              background: var(--accent); color: #04070d; border-radius: 3px; }
  .box.flag .tag { background: var(--warn); }

  aside { width: 340px; flex-shrink: 0; background: var(--panel); border-left: 1px solid var(--line);
          display: flex; flex-direction: column; overflow-y: auto; }
  section { padding: 14px; border-bottom: 1px solid var(--line); }
  h2 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  label { display: block; margin: 9px 0 3px; font-size: 12px; color: var(--muted); }
  input, select, textarea, button {
    width: 100%; padding: 7px 9px; background: #12141a; color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; font: inherit;
  }
  textarea { resize: vertical; min-height: 74px; }
  button { cursor: pointer; background: #262b34; }
  button:hover { background: #303643; }
  button.primary { background: var(--accent); color: #04070d; border-color: var(--accent); font-weight: 600; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .src { font-size: 12px; color: var(--muted); background: #12141a; padding: 8px;
         border-radius: 5px; max-height: 90px; overflow: auto; white-space: pre-wrap; }
  .status { font-size: 12px; color: var(--muted); }
  .status b { color: var(--text); font-weight: 600; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px;
          background: #2a3040; color: var(--muted); margin-right: 4px; }
  .pill.warn { background: #4a3a1c; color: var(--warn); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 6px 8px; border-radius: 5px; cursor: pointer; font-size: 12px;
       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li:hover { background: #262b34; }
  li.sel { background: var(--accent); color: #04070d; }
</style>

<div id="stage"><div id="wrap"><img id="page" alt=""><div id="boxes"></div></div></div>

<aside>
  <section>
    <h2>Project</h2>
    <div class="row"><input id="path" placeholder="out/project.cttproj"><button id="open">Open</button></div>
    <label>Page</label>
    <select id="pageSel"></select>
    <div class="status" id="stat" style="margin-top:10px">no project loaded</div>
  </section>

  <section>
    <h2>Blocks</h2>
    <ul id="list"></ul>
  </section>

  <section id="editor" hidden>
    <h2>Selected <span id="badges"></span></h2>
    <label>Source</label>
    <div class="src" id="src"></div>
    <label>Translation</label>
    <textarea id="tgt"></textarea>
    <div class="row">
      <div><label>Font</label>
        <select id="font">
          <option value="SourceHanSansSC">黑体 Regular</option>
          <option value="SourceHanSansSC-Bold">黑体 Bold</option>
          <option value="SourceHanSerifSC">宋体 Serif</option>
        </select>
      </div>
      <div><label>Align</label>
        <select id="align"><option>center</option><option>left</option><option>right</option></select>
      </div>
    </div>
    <div class="row">
      <div><label>Size (0 = auto)</label><input id="size" type="number" min="0" step="1"></div>
      <div><label>Line spacing</label><input id="ls" type="number" min="0.8" max="2.5" step="0.05"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="apply">Apply</button>
      <button id="reset">Auto-fit</button>
    </div>
  </section>

  <section>
    <h2>Output</h2>
    <div class="row"><input id="exp" placeholder="out/page_zh.jpg"><button id="export">Export</button></div>
    <button id="save" style="margin-top:8px">Save project</button>
  </section>
</aside>

<script>
const API = "http://127.0.0.1:8000";
const $ = id => document.getElementById(id);
let project = null, pageIndex = 0, selected = null, scale = 1;

const api = async (path, opts = {}) => {
  const r = await fetch(API + path, {
    ...opts,
    headers: opts.body ? { "Content-Type": "application/json" } : undefined,
  });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.headers.get("content-type")?.includes("json") ? r.json() : r;
};

const page = () => project?.pages[pageIndex];

async function loadProject(path) {
  project = await api("/api/project/open", { method: "POST", body: JSON.stringify({ path }) });
  pageIndex = 0;
  $("pageSel").innerHTML = project.pages
    .map((p, i) => `<option value="${i}">${i + 1}. ${p.image_path.split(/[\\/]/).pop()}</option>`)
    .join("");
  await showPage();
}

// Re-render is a full round trip on purpose: the server composites from the
// ORIGINAL image plus the current blocks every time, so repeated edits never
// accumulate artefacts the way painting over the last render would.
async function showPage() {
  const p = page();
  if (!p) return;
  $("page").src = `${API}/api/pages/${pageIndex}/render?t=${Date.now()}`;
  await new Promise(res => ($("page").onload = res));
  scale = $("page").clientWidth / p.width;
  drawBoxes();
  renderList();
  const flagged = p.blocks.filter(needsEye).length;
  $("stat").innerHTML = `<b>${p.blocks.length}</b> blocks · <b>${p.width}×${p.height}</b>`
    + (flagged ? ` · <span class="pill warn">${flagged} to review</span>` : "");
}

const needsEye = b => b.kind === "text_bubble" && b.source_conf > 0 && b.source_conf < 0.6;
const translatable = b => b.kind === "text_bubble" && b.source_text.trim();

function drawBoxes() {
  const p = page();
  $("boxes").innerHTML = "";
  p.blocks.filter(translatable).forEach(b => {
    const d = document.createElement("div");
    d.className = "box" + (b.id === selected?.id ? " sel" : "") + (needsEye(b) ? " flag" : "");
    // Draw where the *translation* sits: box + offset. `box` alone is the
    // source-text anchor and does not move when the user drags.
    const box = b.bubble_box || b.box;
    const [ox, oy] = b.offset || [0, 0];
    Object.assign(d.style, {
      left: (box.x1 + ox) * scale + "px", top: (box.y1 + oy) * scale + "px",
      width: (box.x2 - box.x1) * scale + "px", height: (box.y2 - box.y1) * scale + "px",
    });
    d.innerHTML = `<span class="tag">${b.id}</span>`;
    d.onmousedown = e => startDrag(e, b, d);
    $("boxes").appendChild(d);
  });
}

function renderList() {
  $("list").innerHTML = page().blocks.filter(translatable).map(b =>
    `<li data-id="${b.id}" class="${b.id === selected?.id ? "sel" : ""}">${b.id} · ${
      (b.target_text || b.source_text).slice(0, 34).replace(/</g, "&lt;")}</li>`).join("");
  [...$("list").children].forEach(li =>
    li.onclick = () => select(page().blocks.find(b => b.id === li.dataset.id)));
}

function select(b) {
  selected = b;
  $("editor").hidden = !b;
  if (!b) return;
  $("src").textContent = b.source_text || "(none)";
  $("tgt").value = b.target_text || "";
  $("font").value = b.style.font;
  $("align").value = b.style.align;
  $("size").value = b.style.auto_size ? 0 : Math.round(b.style.size);
  $("ls").value = b.style.line_spacing;
  $("badges").innerHTML =
    `<span class="pill">conf ${b.source_conf.toFixed(2)}</span>` +
    (b.edited ? '<span class="pill">edited</span>' : "") +
    (needsEye(b) ? '<span class="pill warn">low conf</span>' : "");
  drawBoxes();
  renderList();
}

function startDrag(e, b, el) {
  e.preventDefault();
  select(b);
  const x0 = e.clientX, y0 = e.clientY;
  const l0 = parseFloat(el.style.left), t0 = parseFloat(el.style.top);
  const move = ev => {
    el.style.left = l0 + (ev.clientX - x0) + "px";
    el.style.top = t0 + (ev.clientY - y0) + "px";
  };
  const up = async ev => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    const dx = (ev.clientX - x0) / scale, dy = (ev.clientY - y0) / scale;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    await patch({ dx, dy });
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
}

async function patch(body) {
  const updated = await api(`/api/pages/${pageIndex}/blocks/${selected.id}`,
    { method: "PATCH", body: JSON.stringify(body) });
  Object.assign(selected, updated);
  await showPage();
  select(selected);
}

$("open").onclick = () => loadProject($("path").value.trim()).catch(e => alert(e.message));
$("pageSel").onchange = e => { pageIndex = +e.target.value; selected = null; $("editor").hidden = true; showPage(); };
$("apply").onclick = () => patch({
  target_text: $("tgt").value,
  font: $("font").value,
  align: $("align").value,
  line_spacing: parseFloat($("ls").value),
  ...(+$("size").value > 0 ? { size: +$("size").value } : {}),
}).catch(e => alert(e.message));
$("reset").onclick = async () => {
  Object.assign(selected, await api(`/api/pages/${pageIndex}/blocks/${selected.id}/reset`, { method: "POST" }));
  await showPage(); select(selected);
};
$("save").onclick = () => api("/api/project/save", { method: "POST", body: JSON.stringify({ path: $("path").value.trim() }) })
  .then(r => alert("saved " + r.saved)).catch(e => alert(e.message));
$("export").onclick = () => api(`/api/pages/${pageIndex}/export`, { method: "POST", body: JSON.stringify({ path: $("exp").value.trim() }) })
  .then(r => alert("exported " + r.exported)).catch(e => alert(e.message));

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { selected = null; $("editor").hidden = true; drawBoxes(); renderList(); }
  if (e.ctrlKey && e.key === "Enter") $("apply").click();
});

api("/api/health").then(h => { if (h.pages) { project = null; $("stat").textContent = "server ready"; } })
  .catch(() => $("stat").textContent = "server unreachable — run: uvicorn ctt.server:app");
</script>
