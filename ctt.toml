# swell-cartoon-translate 配置文件
#
# 优先级（高到低）：命令行参数 > 环境变量 > 本文件 > 代码内置默认值
# 所有值都可以删掉，删掉就用内置默认。
#
# 密钥不放这里。本文件是要提交进版本库的，密钥只从环境变量读：
#   DEEPL_API_KEY   DeepL 的 key
#   CTT_LLM_KEY     远程 OpenAI 兼容服务的 key
#
# 查看当前生效的完整配置：
#   python -m ctt.cli config

target_lang = "zh-Hans"     # 目标语言。zh-Hant 为繁体
source_lang = "auto"        # auto 表示按整页多数字符判定，不逐句猜

# 漫画站下载常附带一批 60x60 的缩略图，它们是合法 JPEG，不过滤会白跑检测。
# 实测某话 410 个文件里有 126 个是这种垃圾。
skip_thumbnails = true
min_page_bytes = 50000

# 模型权重下载位置。留空 = backend/models/
# 特意不用 ~/.cache/huggingface，那是和别的工具共享的目录，卸载时容易误删。
models_dir = ""


# 选哪些文件来翻译。跑之前先在界面上点「预览选中」看看实际选中了什么。
#
[runtime]
# 翻译时占多少机器资源。以下耗时/CPU 均为实测（6 核 i5-11600KF，
# 百分比按 12 逻辑核算）：
#
#   performance  6 线程  19.9s  795%
#   balanced     6 线程  19.8s  795%
#   background   3 线程  20.4s  605%
#
# 意外之处是 background：线程砍一半只慢 2.5%，却让出四分之一的 CPU。
# 这个负载卡在内存带宽上，多给核心也只是在等内存。要一边玩游戏就选它。
#
# 内存和档位无关：实测 n_ctx 从 512 到 4096，常驻内存只从 6383MB 变到 6594MB，
# 那 6.4GB 基本全是模型权重。想少占内存只能换更小的模型。
profile = "background"

# GPU 卸载层数，-1 = 按空闲显存自动决定（上限 12）。
# 只有 performance 档会用 GPU，其余档位强制为 0——这就是玩游戏时的开关。
#
# 实测（4GB GTX 1650 SUPER，约 2.2GB 空闲）：
#    0 层  36.9s  基准
#    8 层  29.0s  1.27x   约 1.7GB 显存
#   12 层  23.9s  1.54x   约 2.0GB 显存   ← 最优
#   16 层  27.0s  1.37x
#   20 层  27.3s  1.35x   ← 从这里开始输出与 CPU 不一致
#   28 层  35.8s  1.03x
#
# 超过 12 层反而变慢：显存不够，开始来回搬数据。
# 另外注意 GPU 卸载不是逐位一致的——CUDA 与 CPU 内核舍入方式不同，层数一多
# 就可能翻转某个 token。12 层是实测仍与 CPU 输出完全相同的最后一档。
gpu_layers = -1


# 注意：本节以下的裸键都属于 [input]。要加顶层配置项必须写在上面这一行之前，
# 否则会变成 input.xxx —— 这正是「未知配置项」警告存在的意义。
[input]
recursive = true         # 递归所有子目录，指向系列文件夹即可一次翻完所有话。
                         # 默认开启：靠 skip_output_dirs 保证不会把上次的成品当素材

min_bytes = 50000        # 小于此体积跳过。缩略图和横幅通常远小于正文页
min_side = 600           # 宽或高任一小于此值就跳过。
                         # 注意是分别限制两边而不是限制面积：长条 webtoon 窄而极高
max_aspect = 4.0         # 宽/高 超过此值判为横幅、标题卡。
                         # 只限制横向——竖条漫画常达 20:1，正是要保留的

# 跳过 _zh / out / output / translated / 汉化 这类目录。
# 关掉它再开递归，会把上次的成品当原图再翻一遍，得到「译文的译文」。
# 输出目录本身无论如何都会被排除。
skip_output_dirs = true

min_width = 0            # 宽度小于此值跳过，0 = 不启用。
                         # 仅当该系列扫图宽度一致时才可靠——实测某话正文页宽度
                         # 从 1001 到 4184 都有，而标题横幅有 1728 宽，比最窄的
                         # 正文页还宽，单靠宽度反而漏不掉它。
                         # 被过滤掉的图不会丢，见 [output] copy_skipped。


[output]
# mirror  = 输出根目录下保留章节结构（推荐）
# nested  = 各章节目录内建 _zh 子目录
# sibling = 生成同级的「章节名_zh」目录
# flat    = 全部平铺（不同章节同名文件会互相覆盖，仅适合单目录）
layout = "mirror"

# 把被过滤掉的图原样复制到输出。
# 成品缺页比有几张没翻更糟，也让过滤器调错只是「没翻」而不是「丢内容」。
# 我们自己上次的成品永远不会被复制。
copy_skipped = true

# 重跑时是否重新翻译已有成品。
# 默认关闭 = 断点续跑：一页约 36 秒，整话重来要几小时。
overwrite = false


[detect]
model = "int8"        # int8 | fp32 | small。实测 int8 与 fp32 结果一致，体积小 5 倍
threshold = 0.35      # 调低会多检出误报，调高会漏掉小气泡


# 长条 webtoon 切片。作用是让任何模型都不会收到整张 14000px 的图。
# 实测 en4.jpg (720x13859) 峰值模型输入从 9.98MP 降到 1.80MP。
[slicing]
target_height = 2000    # 期望的切片高度，会就近找分镜间隙
max_height = 2500       # 硬上限，任何切片都不会超过
min_height = 800        # 下限，避免切得太碎
overlap_ratio = 0.15    # 找不到间隙时强行切，用这个比例重叠，靠 IoU 去重
max_ink = 0.002         # 「该行无文字」的判据：偏离行中位数的像素比例上限
min_gutter_run = 8      # 连续多少行无文字才算一个分镜间隙


[ocr]
# 可选：latin（英/西/法等） korean japanese chinese
# 多个引擎会按识别置信度择优，代价是每个气泡多跑几次
languages = ["latin"]
max_side = 1000         # 气泡裁图送 OCR 前缩放到的最长边
min_confidence = 0.3


[translate]
# 按顺序尝试，后面的补前面留下的空缺。
# 可选：llamacpp（本地 LLM，推荐） deepl llm（远程 OpenAI 兼容） nllb
#
# 注意 nllb 会静默删掉露骨词汇（训练语料做过过滤），成人素材别用它。
backends = ["llamacpp"]


[translate.llamacpp]
# 本地 GGUF，进程内加载，不装后台服务，跑完即释放。
repo_id = "mradermacher/Qwen2.5-7B-Instruct-abliterated-v2-GGUF"
filename = "Qwen2.5-7B-Instruct-abliterated-v2.Q4_K_M.gguf"
model_path = ""     # 指定本地 GGUF 路径则不下载

n_ctx = 4096

# 下面两项由 [runtime] profile 覆盖，改这里没用——档位才是开关。
# 留着是为了直接用 CLI（不经服务端）时有个默认值。
n_gpu_layers = 0
n_threads = 6

# 贪心解码。翻译有标准答案，采样只会带来方差；实测还快一点
# （9.6s vs 10.5s），而且重跑结果可复现。
temperature = 0.0
max_tokens = 1024


[translate.llm]
# 远程或本地的 OpenAI 兼容服务（Ollama / llama.cpp server / 国产 API）
base_url = "http://localhost:11434/v1"
model = "qwen2.5:14b"
temperature = 0.3
timeout = 300.0


[translate.nllb]
model = "facebook/nllb-200-distilled-600M"
batch_size = 16
device = ""         # 留空自动选；填 "cpu" 强制不占显存


[typeset]
font = "SourceHanSansSC"    # 见 typeset/fonts.py 的候选列表
line_spacing = 1.15
align = "center"
min_size = 9                # 小于这个字号就判定为溢出，标记进 needs_review
bubble_inset = 0.10         # 气泡内边距，占短边比例。手工排版大约留这么多
free_text_inset = 0.02      # 无气泡的自由文字用更小的边距


[erase]
# 气泡是纯色底，取蒙版外围环形中位数颜色直接填充即可，比生成式修复快两个数量级。
# LaMa 只在气泡底色非纯色时兜底，v1 跳过拟声词所以基本不触发。
lama_path = ""      # ONNX LaMa 路径，留空则禁用
pad = 32            # 送 LaMa 的小图在蒙版外扩多少像素


# 术语表：跨页保持人名和称谓一致。
# 目前只在 llamacpp / llm 档生效（注入 prompt）；nllb 和 deepl 档只做事后检查。
[glossary]
LIAM = "利亚姆"
EMMA = "艾玛"
AMANDA = "阿曼达"
ALEXA = "阿丽克莎"
